[project]
name = "intencoes-ocultas"
version = "0.1.0"
description = "Computational model of the bluffing card game Intenções Ocultas"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
